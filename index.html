  --green-t:#1e7b3a; --orange-t:#b25e00; --red-t:#d70015; --blue-t:#0062cc;
  --green-soft:#e4f7ea; --orange-soft:#fff1dc; --red-soft:#ffe6e4; --blue-soft:#e5efff;
  --deep:#3b6ee8; --rem:#af52de; --light:#7db4f5; --awake:#ffb340;
  --fg2:#3a3a3c; --fill:#f2f2f7; --bar:rgba(255,255,255,.96);
}
/* ===== mode sombre : réglage de l'iPhone, et automatiquement de 21 h à 7 h ===== */
html.dark{color-scheme:dark;
  --bg:#000; --card:#1c1c1e; --fg:#f2f2f7; --muted:#9a9aa0; --line:#38383a; --soft:#2c2c2e; --fill:#2c2c2e; --fg2:#d1d1d6; --bar:rgba(28,28,30,.94);
  --green-t:#4cd471; --orange-t:#ffb340; --red-t:#ff6961; --blue-t:#6aa8ff;
  --green-soft:#16351f; --orange-soft:#3a2810; --red-soft:#3b1614; --blue-soft:#132848;
  --deep:#5b8cff; --light:#4f86c9; --accent:#0a84ff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-inline:14px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));max-width:720px;margin-inline:auto}
h1{font-size:24px;line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
h3{font-size:14px;margin:14px 0 6px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted)}
.chip.blue{background:var(--blue-soft);color:var(--deep)} .chip.green{background:var(--green-soft);color:var(--green)} .chip.orange{background:var(--orange-soft);color:var(--orange)} .chip.red{background:var(--red-soft);color:var(--red)}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ring{width:104px;height:104px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring>div{width:80px;height:80px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:28px;font-weight:700}
.hero .t{flex:1;min-width:190px}
.big{font-size:22px;font-weight:700;line-height:1.2;margin:6px 0 2px}
.c-blue{color:var(--deep)} .c-green{color:var(--green)} .c-orange{color:var(--orange)} .c-red{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--soft);border-radius:10px;padding:9px 11px;min-width:0}
.kpi b{display:block;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.row:last-child{border:0}
.ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)} .ev:last-child{border:0}
.ev .when{flex:none;width:62px;font-weight:700;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
.dot.blue{background:var(--deep)} .dot.green{background:var(--green)} .dot.orange{background:var(--orange)} .dot.red{background:var(--red)} .dot.none{background:var(--line)}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font:10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
svg .t-fg{fill:var(--fg)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
ul{margin:4px 0 0;padding-left:18px} li{margin:2px 0} .sec li{font-size:14px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--muted);padding:0 6px 5px 0;font-weight:600}
td{padding:5px 6px 5px 0;border-top:1px solid var(--line);white-space:nowrap}
.warn{background:var(--orange-soft);color:var(--orange);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600}

[hidden]{display:none!important}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
header h1::first-letter{text-transform:uppercase}
.hero2{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-left:6px solid var(--c)}
.hero2 .t{flex:1;min-width:180px}
.ring>div small{font-size:14px;font-weight:600;margin-left:1px;color:var(--muted)}
.big2{font-size:20px;font-weight:700;line-height:1.25;margin-bottom:2px;text-wrap:balance}
.sechead{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.sechead h2{margin:0;flex:1}
.ico{width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;color:var(--accent);flex:none}
.ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.btn{margin-top:12px;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--fg);font:600 13.5px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;cursor:pointer}
.btn:active{opacity:.7}
.btn.mini{margin:2px 0 0;width:auto;flex:none;padding:6px 11px;font-size:12px;color:var(--muted)}
.more{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0}
.tl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tv{font-size:20px;font-weight:700;line-height:1.2;margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;text-wrap:balance}
.tv small{font-size:12px;font-weight:600;color:var(--muted)}
.ts{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.35}
.meter{position:relative;height:7px;border-radius:99px;background:var(--line);margin:9px 6px 3px}
.meter::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--grad);opacity:.65}
.mk{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--fg);border:2.5px solid var(--card);transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--line)}
.mk.o{background:var(--card);border-color:var(--fg);box-shadow:none}
.dots{display:flex;gap:4px;margin-top:4px} .dots i{flex:1;height:10px;border-radius:4px}
.seq{display:flex;gap:8px} .seq span{flex:1;text-align:center} .seq i{display:block;height:12px;border-radius:5px} .seq em{font-style:normal;font-size:11px;color:var(--muted)}
.obj{display:flex;gap:14px;align-items:center}
.jd{flex:none;min-width:76px;text-align:center;font-size:30px;font-weight:800;color:var(--accent);line-height:1}
.jd small{display:block;font-size:10.5px;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-top:4px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.intens{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:13px;color:var(--muted)} .intens b{font-size:16px;color:var(--fg)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dchip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:10px;background:var(--soft);min-width:0}
.dchip.today{outline:2px solid var(--fg);outline-offset:-2px}
.dchip .dw{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dchip b{font-size:16px;line-height:1.15;font-variant-numeric:tabular-nums}
.dchip i{width:70%;height:5px;border-radius:99px;margin:2px 0}
.dchip .dk{font-size:10px;line-height:1.15;text-align:center;overflow-wrap:anywhere}

/* ===== habillage façon iPhone, thème clair ===== */
html{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,sans-serif;letter-spacing:-.003em;-webkit-font-smoothing:antialiased;padding-inline:16px}
.stack{gap:14px}
.card{border:0;border-radius:22px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}
header{margin-bottom:2px;align-items:flex-end}
h1{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
header .sub{margin-top:6px}
h2{font-size:17px;letter-spacing:-.01em;text-transform:none;color:var(--fg);font-weight:700}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 8px}
.sub,.muted{color:var(--muted)}
.chip{padding:3px 10px;font-weight:600;background:var(--soft);color:var(--muted)}
.chip.blue{background:var(--blue-soft);color:var(--blue-t)} .chip.green{background:var(--green-soft);color:var(--green-t)}
.chip.orange{background:var(--orange-soft);color:var(--orange-t)} .chip.red{background:var(--red-soft);color:var(--red-t)}
.c-green{color:var(--green-t)} .c-orange{color:var(--orange-t)} .c-red{color:var(--red-t)} .c-blue{color:var(--blue-t)}
.hero2{border:0;background:linear-gradient(155deg,var(--cs) 0%,var(--card) 64%)}
.hero2 .big{font-size:23px;letter-spacing:-.02em}
.ring{width:112px;height:112px;background:conic-gradient(from 0deg,var(--c) calc(var(--p)*1%),rgba(0,0,0,.07) 0)}
.ring>div{width:88px;height:88px;font-size:31px;font-weight:800;letter-spacing:-.03em;box-shadow:0 0 0 1px rgba(0,0,0,.03)}
.sechead{gap:10px;margin-bottom:12px}
.sechead h2{flex:1}
.ico{width:30px;height:30px;border-radius:9px;color:#fff;box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)}
.ico svg{width:17px;height:17px;stroke-width:2.2}
.big2{font-size:21px;letter-spacing:-.015em}
.btn{margin-top:14px;padding:11px 12px;border:0;border-radius:14px;background:var(--soft);color:var(--accent);font-size:15px;font-weight:600}
.btn::after{content:" ›";font-weight:700}
.btn[aria-expanded="true"]::after{content:" ‹"}
.btn.mini{margin:0;padding:7px 13px;border-radius:99px;background:var(--blue-soft);color:var(--accent);font-size:13px}
.btn.mini::after{content:""}
.more{border-top:1px solid var(--line);border-top-style:solid}
.kpi{background:var(--soft);border-radius:14px;padding:11px 13px}
.kpi b{font-size:21px;letter-spacing:-.02em}
.tile{border:0;border-radius:20px;padding:13px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}
.tl{font-size:11px;letter-spacing:.08em}
.tv{font-size:21px;letter-spacing:-.02em}
.meter{height:8px;margin:10px 7px 4px}

@media (max-width:360px){.glance{grid-template-columns:1fr}}

/* ===== feuilles de détail (toucher une tuile ou un bloc) ===== */
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.tap:active{transform:scale(.985)}
.tile,.hero2,.obj{position:relative}
.chev{position:absolute;top:10px;right:14px;color:#c4c4c9;font-size:22px;font-weight:600;line-height:1}
.tile .tl{padding-right:18px}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.34);opacity:0;transition:opacity .28s ease}
.panel{position:relative;width:100%;max-width:720px;max-height:92%;display:flex;flex-direction:column;background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -12px 44px rgba(0,0,0,.18);transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.85,.25,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open .scrim{opacity:1}
.sheet.open .panel{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:9px auto 4px;flex:none}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 18px 12px;border-bottom:1px solid var(--line);flex:none}
.ptitle{display:flex;align-items:center;gap:10px;min-width:0}
.ptitle h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.close{flex:none;border:0;background:var(--blue-soft);color:var(--accent);font:600 14px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:8px 14px;border-radius:99px;cursor:pointer}
.pbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 28px;min-height:0}
.pbody h3:first-child{margin-top:0}
body.lock{overflow:hidden}
.prio{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px;line-height:1.35} .prio i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font:700 12px/22px -apple-system,system-ui,sans-serif;text-align:center;font-style:normal} .prio span{min-width:0}
.dchip,.dayrow,[data-day]{cursor:pointer} .dayrow:active,.dchip:active{opacity:.6}
.exo{margin:4px 0 8px;padding-left:22px} .exo li{margin:7px 0;line-height:1.4}
.doseb{display:flex;flex-direction:column;gap:2px;background:var(--blue-soft);border-radius:12px;padding:10px 12px;margin:0 0 8px;font-size:14px} .doseb b{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)} .doseb.adapt{background:var(--orange-soft)}
.jh{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px;display:block}
.seg{display:flex;gap:6px} .seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:var(--fill,#f2f2f7);color:var(--fg);font:600 14px -apple-system,system-ui,sans-serif;cursor:pointer} .seg button.on{background:var(--accent);color:#fff}
.jchips{display:flex;flex-wrap:wrap;gap:6px} .jchip{border:0;border-radius:999px;padding:8px 13px;min-height:36px;background:var(--fill,#f2f2f7);color:var(--fg);font:600 13px -apple-system,system-ui,sans-serif;cursor:pointer} .jchip.on{background:var(--accent);color:#fff}
.jsel,.jnote{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--card,#fff);color:var(--fg);font:15px -apple-system,system-ui,sans-serif;padding:9px 10px} .jnote{resize:vertical}
.tjd{display:flex;gap:12px;align-items:center;margin-bottom:10px} .tjd .jd{flex:none;min-width:58px;height:58px;border-radius:16px;background:var(--orange-soft);color:var(--orange-t,#b25e00);font:800 22px/58px -apple-system,system-ui,sans-serif;text-align:center}

html.dark .card,html.dark .tile{box-shadow:none}
html.dark .mk.o{border-color:#f2f2f7}
html.dark .chev{color:#636366}
html.dark body{-webkit-font-smoothing:antialiased}
/* ===== organisation en onglets (écran du jour + Semaine, Corps, Tournoi) ===== */
body{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.kicker{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
header h1{margin-top:2px}
.jchip,.seg button,.exb,.tabbar button,.ldseg button{transition:transform .12s}
.jchip:active,.seg button:active,.exb:active,.tabbar button:active,.ldseg button:active{transform:scale(.95)}
.fdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.syncchip{flex:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.syncchip.green{background:var(--green-soft);color:var(--green-t)} .syncchip.orange{background:var(--orange-soft);color:var(--orange-t)}
.verdict{display:flex;flex-direction:column;gap:12px;position:relative}
.vhead{display:flex;align-items:center;gap:12px;padding-right:16px}
.vdot{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--c)}

<body>
<div id="appnote" role="status"></div>
<div class="stack" id="app"></div>
<div id="appfoot"></div>
<div class="sheet" id="sheet" hidden aria-hidden="true">
  <div class="scrim" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
    <div class="grab"></div>
    <div class="phead"><div class="ptitle"><span id="sheet-i"></span><h2 id="sheet-t"></h2></div><button class="close" type="button" data-close>Fermer</button></div>
    <div class="pbody" id="sheet-b"></div>
  </div>
</div>
<script>
window.DATA = /*DATA*/null;
</script>
<script id="boot">
/* Mode « appli » : quand la page est ouverte hors Scriptable (window.DATA vide), elle charge elle-même les données
   depuis le dépôt privé avec le jeton gardé sur cet appareil (localStorage). Avec DATA injectée (Scriptable, brief.js,
   check_page.js), ce bloc ne fait rien. */
(function(){
if(window.DATA)return;
window.__APP=true;window.__HOLD=true;
var KEY="recup-gh",CK="recup-data",DEF={owner:"cycyprog",repo:"recup-bad"};
var FILES={status:"status.json",history:"history.json",plan:"plan.json",journal:"journal.json",calendar:"calendar.json"};
var REQUIRED={status:1,history:1,plan:1},STALE=15*60000,CAL_STALE=24*3600000;
var APP=document.getElementById("app"),NOTE=document.getElementById("appnote"),FOOT=document.getElementById("appfoot");
var cfg=null,loaded=null,busy=false,shown=false,status="loading";
(function(){var dark=false,h=+new Date().toLocaleString("fr-FR",{timeZone:"Europe/Paris",hour:"2-digit",hour12:false}).slice(0,2);
  try{dark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches}catch(e){}
  document.documentElement.classList.toggle("dark",dark||h>=21||h<7)})();
function ls(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function when(t){var d=new Date(t),f=function(o){return d.toLocaleString("fr-FR",Object.assign({timeZone:"Europe/Paris"},o))};
  var same=f({year:"numeric",month:"numeric",day:"numeric"})===new Date().toLocaleString("fr-FR",{timeZone:"Europe/Paris",year:"numeric",month:"numeric",day:"numeric"});
  return (same?"":f({day:"numeric",month:"short"})+" à ")+f({hour:"2-digit",minute:"2-digit"})}
function gh(c,path,raw){
  return fetch("https://api.github.com/repos/"+c.owner+"/"+c.repo+(path?"/contents/"+path:""),
    {headers:{Authorization:"Bearer "+c.token,Accept:raw?"application/vnd.github.raw+json":"application/vnd.github+json"},cache:"no-store"});
}
/* ----- écrans ----- */
function screen(html){APP.innerHTML='<div class="appc">'+html+'</div>';NOTE.className="";FOOT.className="";window.scrollTo(0,0)}
function showLoading(){screen('<h1>Récup bad</h1><div class="appspin"></div><p class="small" style="text-align:center">Chargement…</p>')}
function showConfig(msg){
  screen('<h1>Récup bad</h1>'+
    '<p>Colle le jeton GitHub de l\'appli (accès « Contents » en lecture et écriture, limité au dépôt <b>'+esc(DEF.owner+"/"+DEF.repo)+'</b>). Il reste uniquement sur cet appareil.</p>'+
    '<input id="apptok" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="github_pat_…" aria-label="Jeton GitHub">'+
    '<p id="appmsg" role="alert" class="'+(msg?"err":"")+'">'+esc(msg||"")+'</p>'+
    '<div class="row"><button type="button" data-app="test">Tester</button><button type="button" class="main" data-app="save">Enregistrer</button></div>');
}
function showError(msg){
  screen('<h1>Récup bad</h1><p class="err">'+esc(msg)+'</p><div class="row"><button type="button" class="main" data-app="refresh">Réessayer</button><button type="button" data-app="forget">Oublier le jeton</button></div>');
}
function msg(t,k){var m=document.getElementById("appmsg");if(m){m.className=k||"";m.textContent=t}}
function paint(){
  if(!loaded){NOTE.className="";FOOT.className="";return}
  var lines=[],warn=false;
  if(status==="offline")lines.push("Hors ligne · données de "+when(loaded.at));
  else if(status==="limit")lines.push("Limite GitHub atteinte, réessaie plus tard · données de "+when(loaded.at));
  else if(status==="loading")lines.push("Données de "+when(loaded.at)+" · actualisation…");
  var left=cfg&&cfg.exp?cfg.exp-Date.now():cfg&&cfg.at?cfg.at+365*86400000-Date.now():null;
  if(left!=null&&left>0&&left<30*86400000){lines.push("Ton jeton GitHub expire dans "+Math.max(1,Math.ceil(left/86400000))+" jour"+(left>86400000*1.5?"s":"")+" : crée-en un nouveau (étapes dans docs/PWA.md), puis « Oublier le jeton » et colle le nouveau.");warn=true}
  if(loaded.calAt&&Date.now()-new Date(loaded.calAt).getTime()>CAL_STALE){lines.push("Agenda non mis à jour depuis plus de 24 h : ouvre Scriptable pour le synchroniser.");warn=true}
  NOTE.innerHTML=lines.map(esc).join("<br>");NOTE.className=lines.length?"on"+(warn||status!=="ok"?" warn":""):"";
  FOOT.innerHTML='<div>Données de '+esc(when(loaded.at))+'</div><button type="button" data-app="refresh">Actualiser</button><button type="button" data-app="forget">Oublier le jeton</button>';
  FOOT.className="on";
}
/* ----- données ----- */
async function fetchAll(c){
  var names=Object.keys(FILES);
  var res=await Promise.all(names.map(function(n){return gh(c,FILES[n],true).then(function(r){return {n:n,r:r}},function(){return {n:n,err:1}})}));
  var out={},auth=false,limit=false,net=false;
  for(var i=0;i<res.length;i++){
    var x=res[i],n=x.n,r=x.r;
    if(x.err){if(REQUIRED[n])net=true;continue}
    var ex=r.headers&&r.headers.get&&r.headers.get("github-authentication-token-expiration");
    if(ex&&!cfg.exp){var ed=Date.parse(String(ex).replace(" UTC","Z").replace(" ","T"));if(isFinite(ed)){cfg.exp=ed;lsSet(KEY,cfg)}}
    if(r.status===401)auth=true;
    else if(r.status===403){if(r.headers.get("x-ratelimit-remaining")==="0")limit=true;else auth=true}
    else if(r.status===404){if(REQUIRED[n])auth=true}
    else if(r.ok){try{out[n]=await r.json()}catch(e){if(REQUIRED[n])net=true}}
    else if(REQUIRED[n])net=true;
  }
  if(auth)return {fail:"auth"};
  if(limit)return {fail:"limit"};
  if(net)return {fail:"net"};
  return {ok:out};
}
function build(o){var cal=o.calendar||{};
  return {status:o.status,history:o.history,plan:o.plan,journal:(o.journal&&o.journal.days)?o.journal:{days:{}},events:cal.events||[]}}
function flush(){try{if(window.__syncPending&&window.__syncPending())window.__ghSync()}catch(e){}}
function run(){try{(new Function(document.getElementById("main").textContent))()}catch(e){console.error(e)}}
function apply(d,at,calAt,fresh){
  var same=shown&&loaded&&JSON.stringify(loaded.data)===JSON.stringify(d);
  loaded={data:d,at:at,calAt:calAt};
  window.DATA=Object.assign({},d,{gh:{owner:cfg.owner,repo:cfg.repo,token:cfg.token}});
  window.__HOLD=false;
  var sheetOpen=document.body.classList.contains("lock");
  if(!shown||!same||(fresh&&!sheetOpen)){
    if(fresh)window.__ANF=0;   // l'analyse du coach est relue avec les nouvelles données
    if(shown&&window.__rerun)window.__rerun();else run();
  }
  shown=true;
}
async function refresh(){
  if(busy||!cfg)return;
  busy=true;status="loading";paint();
  var r;try{r=await fetchAll(cfg)}catch(e){r={fail:"net"}}
  busy=false;
  if(r.ok){
    status="ok";var d=build(r.ok),at=Date.now(),calAt=(r.ok.calendar||{}).updatedAt||null;
    lsSet(CK,{at:at,calAt:calAt,data:d});
    window.__JREMOTE=null;apply(d,at,calAt,true);paint();flush();
  }else if(r.fail==="auth"){
    shown=false;window.__HOLD=true;loaded=null;
    showConfig("GitHub refuse ce jeton (expiré, révoqué ou sans accès au dépôt). Crée-en un nouveau et colle-le ici.");
  }else{
    status=r.fail==="limit"?"limit":"offline";
    if(loaded)paint();else showError(r.fail==="limit"?"Limite GitHub atteinte, réessaie dans un moment.":"Impossible de joindre GitHub. Vérifie ta connexion.");
  }
}
function start(){
  var c=ls(KEY);
  cfg=c&&typeof c.token==="string"&&c.token&&!/COLLE_ICI/.test(c.token)?{owner:c.owner||DEF.owner,repo:c.repo||DEF.repo,token:c.token,at:c.at||Date.now(),exp:c.exp||null}:null;
  if(!cfg){showConfig();return}
  if(!c.at)lsSet(KEY,cfg);   // jeton saisi avant cette version : on date à partir d'aujourd'hui (approximatif)
  var k=ls(CK);
  if(k&&k.data&&k.data.status)apply(k.data,k.at||Date.now(),k.calAt||null,false);else showLoading();
  refresh();
}
function forget(){
  if(!window.confirm("Oublier le jeton sur cet appareil ? Il faudra le coller à nouveau."))return;
  lsDel(KEY);lsDel(CK);lsDel("recup-analyse");lsDel("recup-analyses");
  cfg=null;loaded=null;shown=false;window.__HOLD=true;window.DATA=undefined;showConfig();
}
async function testTok(){

    out.push(card({key:"statut",title:"Statut d'entraînement",icon:"pulse",sum:'<p class="muted" style="margin:0">Pas encore assez d\'historique pour calculer ton statut ('+esc(ST.why)+'). Il apparaîtra dès que le collecteur aura rempli quatre semaines de séances.</p>'+(GI?'<p class="small" style="margin:8px 0 0">Statut Garmin en attendant : <b>'+esc(GI[0])+'</b>'+(G.acwr!=null?', ratio de charge '+fr1(+G.acwr):'')+'.</p>':'')}));
    return;
  }
  var lc=LVC[ST.level],lct=LVT[ST.level];
  var n=21,w=360,L=44,R=4,cw=(w-L-R)/n,ch=20,hh=2*ch+34,s="",hasG=false,series=[];

  if(hasG)s+='<text x="0" y="'+(10+ch+4+ch/2+3)+'" class="t-fg" style="font-weight:600">Garmin</text>';
  series.forEach(function(m,i){
    var x=L+i*cw,col=m.r.ok?LVC[m.r.level]:"var(--line)";
    s+='<rect x="'+(x+1)+'" y="10" width="'+(cw-2)+'" height="'+ch+'" rx="3" fill="'+col+'" opacity="'+(m.r.ok?.9:.5)+'"><title>'+esc(shortDay(m.t)+" : "+(m.r.ok?m.r.label:"pas assez d'historique"))+'</title></rect>';
    if(hasG){var gc=m.g?(m.g[1]==="none"?"var(--line)":LVC[m.g[1]]):"var(--line)";
      s+='<rect x="'+(x+1)+'" y="'+(10+ch+4)+'" width="'+(cw-2)+'" height="'+ch+'" rx="3" fill="'+gc+'" opacity="'+(m.g?.9:.4)+'"><title>'+esc(shortDay(m.t)+" : Garmin "+(m.g?m.g[0]:"–"))+'</title></rect>'}
    if(i%4===0||i===n-1)s+='<text x="'+(x+cw/2)+'" y="'+(hh-6)+'" text-anchor="middle" style="font-size:9px">'+parseInt(dkey(m.t).slice(8),10)+'</text>';
  });
  var strip=svg(w,hh,s,"Statut d'entraînement sur 21 jours")+'<div class="legend"><span><i style="background:var(--green)"></i>favorable</span><span><i style="background:var(--deep)"></i>récupération, coupure</span><span><i style="background:var(--orange)"></i>à surveiller</span><span><i style="background:var(--red)"></i>charge excessive, fatigue</span></div>';
  var sum='<div class="big2" style="color:'+lct+'">'+esc(ST.label)+'</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px"><span class="chip '+ST.level+'">mon statut</span>'+(GI?'<span class="chip '+(GI[1]==="none"?"":GI[1])+'">Garmin : '+esc(GI[0])+'</span>':'')+'</div>'+
    '<p style="margin:0 0 6px">'+esc(ST.meaning)+'</p><p style="margin:0 0 10px"><b>Ce que ça change.</b> '+esc(ST.impact)+'</p>'+strip;
  var bodyTxt={good:"bon",mid:"moyen",bad:"dégradé"}[ST.body];
  var trTxt=ST.trend==="up"?"en hausse":ST.trend==="down"?"en baisse":ST.trend==="flat"?"stable":"–";
  var more='<div class="grid" style="margin-top:0">'+
    '<div class="kpi"><b>'+Math.round(ST.acute)+'</b><span>charge 7 jours · habituelle '+Math.round(ST.hab)+'</span></div>'+
    '<div class="kpi"><b>'+frat(ST.ratio)+'</b><span>ratio, mon calcul'+(G&&G.acwr!=null?' · Garmin '+fr1(+G.acwr):'')+'</span></div>'+
    '<div class="kpi"><b>'+bodyTxt+'</b><span>réponse du corps (VFC, sommeil)</span></div>'+
    '<div class="kpi"><b>'+trTxt+'</b><span>charge de fond'+(ST.trendPct!=null?' ('+(ST.trendPct>=0?"+":"")+Math.round(ST.trendPct*100)+' %)':'')+'</span></div></div>';
  var why=[];ST.reasons.forEach(function(x){why.push(x)});ST.okReasons.forEach(function(x){why.push(x)});
  why.push("charge des 7 derniers jours : "+Math.round(ST.acute)+" contre "+Math.round(ST.hab)+" en moyenne sur tes semaines habituelles");
  if(ST.gapBefore)why.push("la semaine d'avant était presque vide ("+Math.round(ST.w[1].sum)+") : elle est écartée de ma référence, sinon le ratio serait gonflé comme chez Garmin");
  else if(ST.nGap>0)why.push(ST.nGap+" semaine"+(ST.nGap>1?"s":"")+" creuse"+(ST.nGap>1?"s":"")+" écartée"+(ST.nGap>1?"s":"")+" de la référence");
  if(ST.daysToTour!=null&&ST.daysToTour<=30)why.push("tournoi dans "+ST.daysToTour+" jours ("+ST.tourName+")"+(ST.taper?" : phase d'affûtage":""));
  more+='<h3>Pourquoi ce statut</h3><ul>'+why.map(function(x){return '<li class="small">'+esc(x)+'</li>'}).join("")+'</ul>';
  var iW=more.length;
  var ws=ST.w.slice().reverse(),w2=360,h2=140,L2=34,R2=6,T2=14,B2=24,mx=Math.max(100,Math.max.apply(null,ws.map(function(x){return x.sum})),ST.hab)*1.12,Y=scale(0,mx,h2-B2,T2),bw=(w2-L2-R2)/ws.length,s2="";
  [0,Math.round(mx/2),Math.round(mx)].forEach(function(g){s2+='<line x1="'+L2+'" x2="'+(w2-R2)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="var(--line)"/><text x="'+(L2-4)+'" y="'+(Y(g)+3)+'" text-anchor="end">'+g+'</text>'});
  s2+='<rect x="'+L2+'" y="'+Y(Math.min(ST.hab*1.3,mx))+'" width="'+(w2-L2-R2)+'" height="'+(Y(ST.hab*0.8)-Y(Math.min(ST.hab*1.3,mx)))+'" fill="var(--green)" opacity=".13"/>';
  s2+='<line x1="'+L2+'" x2="'+(w2-R2)+'" y1="'+Y(ST.hab)+'" y2="'+Y(ST.hab)+'" stroke="var(--orange)" stroke-dasharray="4 3"/>';
  ws.forEach(function(x,i){var bx=L2+i*bw+bw*0.16,ww=bw*0.68,cur=(i===ws.length-1),gap=x.covered&&x.sum<ST.thr,fill=!x.covered?"var(--line)":cur?lc:gap?"var(--line)":"var(--light)";
    s2+='<rect x="'+bx+'" y="'+Y(x.sum)+'" width="'+ww+'" height="'+Math.max(1,Y(0)-Y(x.sum))+'" rx="3" fill="'+fill+'" opacity="'+(x.covered?1:.4)+'"/>';
    if(x.covered)s2+='<text x="'+(bx+ww/2)+'" y="'+(Y(x.sum)-3)+'" text-anchor="middle" class="t-fg" style="font-size:9.5px">'+Math.round(x.sum)+'</text>';
    s2+='<text x="'+(bx+ww/2)+'" y="'+(h2-9)+'" text-anchor="middle" style="font-size:9px">'+(cur?"7 j":gap?"creuse":fmt(x.b,{day:"numeric",month:"numeric"}))+'</text>'});
  more+='<h3>Charge par fenêtre de 7 jours (bande verte : ta fenêtre normale ; pointillé : ta référence)</h3>'+svg(w2,h2,s2,"Charge par fenêtre de 7 jours")+
    '<p class="small muted" style="margin:4px 0 0">Chaque barre cumule 7 jours glissants ; la dernière (colorée) est la période en cours, les barres grises sont des semaines creuses écartées de la référence. La date sous chaque barre est celle de la fin de la fenêtre.</p>';
  var iG=more.length;
  more+='<h3>Face à Garmin</h3>';
  if(GI){
    more+='<div class="grid"><div class="kpi"><b>'+esc(GI[0])+'</b><span>statut Garmin</span></div>'+
      '<div class="kpi"><b>'+(G.acwr!=null?fr1(+G.acwr):"–")+'</b><span>ratio Garmin'+(G.acwr!=null?(G.acwr>1.5?" · haut":G.acwr>1.3?" · élevé":G.acwr>=0.8?" · optimal":" · bas"):"")+'</span></div>'+
      '<div class="kpi"><b>'+(G.atl!=null?Math.round(G.atl):"–")+' / '+(G.ctl!=null?Math.round(G.ctl):"–")+'</b><span>charge aiguë / chronique</span></div>'+
      '<div class="kpi"><b>'+(G.vo2max!=null?Math.round(G.vo2max):"–")+'</b><span>VO2max, mesurée en course</span></div></div>';
    var lm=ST.level,lg=GI[1],ag;
    if(lg==="none")ag="Garmin ne donne pas de statut exploitable aujourd'hui.";
    else if(lm===lg)ag="Mon statut et celui de Garmin vont dans le même sens.";
    else if((lm==="red"||lm==="orange")&&lg==="green")ag="Garmin juge surtout ta charge et ta tendance de VO2max, sans tenir compte de ta VFC. Ici ta réponse physiologique est moins bonne que ta charge ne le laisse croire : je privilégie la prudence.";
    else if(lm==="green"&&(lg==="red"||lg==="orange"))ag="Garmin est plus alarmiste que moi : il compare ta charge récente à une moyenne gonflée ou tirée vers le bas par tes semaines creuses, alors que ton corps répond bien.";
    else if(lm==="blue"&&lg==="green")ag="Garmin y voit de la progression ; moi je lis surtout une charge basse par rapport à ton habitude.";
    else ag="Garmin et moi lisons la situation différemment : les deux calculs ne partent pas de la même référence de charge.";
    more+='<p class="small" style="margin:8px 0 0">'+esc(ag)+'</p><p class="small muted" style="margin:6px 0 0">La VO2max Garmin vient de ta course à pied : elle ne mesure ni ton explosivité ni ta répétition d\'efforts au badminton, ne t\'en sers pas pour piloter l\'entraînement.</p>';
  } else more+='<p class="small muted" style="margin:0">Le statut Garmin n\'est pas encore collecté (il arrivera avec la prochaine mise à jour du collecteur).</p>';
  more+='<p class="small muted" style="margin:10px 0 0">Statut calculé par règles à partir de tes séances, de ta VFC et de ton sommeil, avec ta propre référence de charge ; ce n\'est pas un avis médical.</p>';
  CHG.win=more.slice(iW,iG);CHG.garmin=more.slice(iG);

})();

/* ===== onglet Corps : la récupération d'abord, puis les leviers, le sommeil et les signaux ===== */
out=TB.body;
var CB=window.__COACHB||{};
function fmtWhen(t){return fmt(t,{weekday:"long",hour:"2-digit",minute:"2-digit"})}
function sessAt(){if(!CB.session||!CB.trainToday)return null;var t=NOW+(tmn(CB.session)-tmn(hm(NOW)))*60000;return t>NOW?t:null}

/* ----- ta récup (grand bloc) ----- */
(function(){
  var gr=S.garminReadiness||null,lv=last?freshLvl:"green";
  var bigTxt,subTxt;
  if(!last){bigTxt="Récupéré";subTxt="Aucune séance récente."}
  else if(remNow<0.5){bigTxt="Récupéré";subTxt="depuis "+fmtWhen(last.r)}
  else{bigTxt=hTxt(remNow);subTxt="avant d'être complètement récupéré ("+fmtWhen(last.r)+")"}
  var okAt=last?last.e+(last.r-last.e)*P.ok/100:null;
  var lines=[];
  if(last&&remNow>=0.5)lines.push(okAt>NOW?"Intensité normale possible dès <b>"+esc(fmtWhen(okAt))+"</b>.":"Tu peux déjà t'entraîner normalement : le reste se récupère en douceur.");
  var tS=sessAt();
  if(tS){var r=remAt(tS);lines.push("À ta séance de <b>"+esc(CB.session)+"</b> : "+(r<0.5?"tu seras récupéré.":"il te restera "+esc(hTxt(r))+" de récupération."))}
  if(gRem!=null)lines.push("Garmin estime <b>"+(gRem<0.5?"0 h":Math.round(gRem)+" h")+"</b> de repos restant"+(Math.abs(gRem-(last&&last.r>NOW?(last.r-NOW)/H:0))>=12?" : écart important, fie-toi surtout à ta VFC du matin.":", proche de mon calcul."));
  var sum='<div class="rhero"><div class="rbig c-'+lv+'">'+esc(bigTxt)+'</div><div class="rsub">'+esc(subTxt)+'</div>'+
    (last?'<div class="rbar" role="img" aria-label="Récupération à '+Math.round(pctNow)+' %"><i style="width:'+cl(pctNow).toFixed(0)+'%;background:var(--'+lv+')"></i></div><div class="rscale"><span>fin de séance</span><span>'+Math.round(pctNow)+' % récupéré</span><span>complet</span></div>':'')+
    '</div>'+(lines.length?'<ul class="rlist">'+lines.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul>':'')+
    '<h3>Sur 7 jours</h3>'+freshChart()+'<div class="legend"><span><i style="background:var(--accent)"></i>récupération restante (h)</span><span><i style="background:var(--deep)"></i>séances</span></div>';
  /* ce qui a fait ce temps */
  var drv=[];
  if(last){
    var base=last.l<(P.b1||100)?(P.h1||12):last.l<(P.b2||200)?(P.h2||24):last.l<(P.b3||300)?(P.h3||36):(P.h4||48);
    drv.push("Dernière séance : "+last.n+" ("+fmtWhen(last.s)+"), charge "+Math.round(last.l)+" : "+base+" h de repos de base.");
    if(!nn(HRV)&&HRV<P.hrvLow)drv.push("VFC basse ce matin ("+Math.round(HRV)+" ms) : +"+(P.hrvPlus||12)+" h.");
    if(!nn(SLP)&&SLP<P.sleepLow)drv.push("Nuit courte ou agitée (score "+Math.round(SLP)+") : +"+(P.sleepPlus||6)+" h.");
    if(!nn(HRV)&&!nn(SLP)&&HRV>=(P.hrvGood||50)&&SLP>=(P.sleepGood||75))drv.push("Très bonne nuit et VFC haute : −"+(P.bonus||6)+" h.");
    if(JT.legs==="fresh")drv.push("Tu as noté des jambes fraîches : −6 h.");
    if(JT.legs==="heavy")drv.push("Tu as noté des jambes lourdes : +12 h.");
    drv.push("Total prévu pour cette séance : "+Math.round(last.h)+" h de récupération.");
  }
  var more=(drv.length?'<h3 style="margin-top:0">Ce qui fait ce temps</h3><ul>'+drv.map(function(x){return '<li class="small">'+esc(x)+'</li>'}).join("")+'</ul>':'')+
    '<p class="small muted" style="margin:8px 0 0">Les ajustements du matin ne s\'appliquent que si ta dernière séance a eu lieu avant la nuit.</p>';
  var tbl='<h3>Dernières séances</h3><div class="tablewrap"><table><thead><tr><th>Séance</th><th>Date</th><th>Charge</th><th>Repos</th></tr></thead><tbody>'+
    SS.slice(-8).reverse().map(function(x){return '<tr><td>'+esc(x.n)+'</td><td>'+esc(fmt(x.s,{weekday:"short",day:"numeric",month:"short"}))+'</td><td>'+Math.round(x.l)+'</td><td>'+Math.round(x.h)+' h</td></tr>'}).join("")+'</tbody></table></div>';
  more+=tbl;CHG.table=tbl;
  more+='<h3>Mon calcul contre Garmin</h3><div class="grid"><div class="kpi"><b>'+(last&&last.r>NOW?Math.round((last.r-NOW)/H)+" h":"prêt")+'</b><span>récupération restante, mon modèle</span></div>'+
    '<div class="kpi"><b>'+(gRem!=null?Math.round(gRem)+" h":"–")+'</b><span>récupération restante, Garmin</span></div>'+
    '<div class="kpi"><b>'+(gr&&!nn(gr.score)?gr.score:"–")+'</b><span>disponibilité Garmin'+(gr&&gr.level?" · "+esc(String(gr.level).toLowerCase()):"")+'</span></div></div>';
  more+='<h3>Comment je calcule ce temps</h3><p class="small" style="margin:0 0 8px">C\'est une <b>estimation</b>, pas une mesure. Je pars de la charge réelle de ta dernière séance (12 à 48 h de repos), je reporte une partie de la fatigue quand les séances sont rapprochées, puis je recale chaque matin avec ta VFC, ton sommeil et ton ressenti des jambes ; les nuits taguées malade, alcool, repas tardif ou voyage ne faussent pas ta base VFC. Garmin ne connaît ni ton ressenti ni ces tags. Compte une marge d\'environ ±10 %.</p>'+
    '<p class="small" style="margin:0 0 8px"><b>Test sur 56 de tes matins réels (août à octobre).</b> Le niveau de récupération prévu à 7 h 30 suit ta VFC du matin (corrélation de +0,53). Sous 50 % de récupération, ta VFC moyenne est de 40 ms ; entre 50 et 80 %, de 46 ms ; au-dessus de 80 %, de 52 ms. Le lien est réel mais modeste : une nuit isolée (alcool, repas tardif, stress) casse la VFC sans rapport avec l\'entraînement.</p>'+
    '<p class="small muted" style="margin:0">Chaque jour, j\'enregistre mon temps et celui de Garmin à côté de ta VFC du lendemain : dans 3 à 4 semaines, je saurai lequel colle le mieux à ton corps, et je recalerai le modèle.</p>';
  out.push(card({key:"fraicheur",title:"Ta récupération",icon:"pulse",sum:sum,more:more}));

/* ----- tes leviers de récup aujourd'hui (conseils calculés) ----- */
(function(){
  var L=[];function add(p,t,why,how){L.push({p:p,t:t,why:why,how:how})}
  var sick=tagsT.indexOf("malade")>=0, tS=sessAt(), late=CB.session&&tmn(CB.session)>=19*60;
  if(sick)add(-1,"Repos, eau et sommeil","Tu as indiqué être malade.","Aucun entraînement. Bois régulièrement, mange léger et chaud, dors dès que tu peux. Reprise 24 h après la fin de la fièvre et des courbatures.");
  add(debtH>0?0:debt7H>0?1:3,"Au lit avant "+(CB.bed||"23:00"),
    debt7H>0?"Ta dette de sommeil est de "+fr1(debt7H)+" h.":"Le sommeil reste ton premier outil de récupération.",
    "Écrans coupés 45 min avant, lumière tamisée, chambre fraîche (environ 18 °C), pas de café après 14 h.");
  if(!sick&&tS)add(1,"Recharge après ta séance de "+CB.session,"C'est dans l'heure qui suit que les muscles récupèrent le mieux.",
    "25 à 30 g de protéines avec des glucides (repas complet, ou skyr et banane) et 500 ml d'eau. Puis 10 minutes de mobilité douce."+(late?" Séance tardive : douche tiède et 1 h de calme avant le lit.":""));
  var hrvPct=(!nn(HRV)&&hrvB)?HRV/hrvB-1:null;
  if(hrvPct!=null&&hrvPct<=-0.1)add(0.5,"Calme ton système nerveux","VFC de "+Math.round(HRV)+" ms, "+Math.round(-hrvPct*100)+" % sous ta base.","10 minutes de marche dehors, 5 minutes de respiration lente (inspire 4 s, expire 6 s), pas d'alcool ce soir.");
  if(rhrDelta!=null&&rhrDelta>=3)add(1,"Bois davantage et surveille","FC au repos à +"+Math.round(rhrDelta)+" bpm de ta base : fatigue, chaleur ou début de maladie.","2 à 2,5 L d'eau dans la journée. Si demain elle reste haute avec des courbatures sans raison, prends un jour de repos.");
  else if(tS)add(4,"Hydrate-toi avant la séance","Une petite déshydratation suffit à ralentir la récupération.","Un grand verre d'eau à chaque repas et 500 ml dans les 2 h avant de jouer.");
  if(!nn(TODAY.stress)&&TODAY.stress>=35)add(2,"Baisse le stress de la journée","Stress moyen de "+Math.round(TODAY.stress)+" aujourd'hui : il freine la récupération autant qu'une séance.","Deux pauses de 5 minutes loin de l'écran, et une marche après le dîner.");
  if(!nn(TODAY.bbHigh)&&TODAY.bbHigh<50)add(2,"Sieste courte","Body Battery montée à seulement "+Math.round(TODAY.bbHigh)+" cette nuit.","20 minutes maximum, avant 15 h, pour ne pas abîmer la nuit suivante.");
  if(!nn(vRatio)&&vRatio>1.5&&!sick)add(2,"Ne rajoute pas de séance","Tes 7 derniers jours sont à × "+fr1(vRatio)+" de ton habitude.","Envie de bouger ? Marche ou vélo très facile, 20 à 30 minutes, pas plus.");
  if(taper&&daysToTour>0)add(2,"Protège ta fraîcheur","Tournoi dans "+daysToTour+" jours.","Rien de nouveau, pas de sur-effort ; vise 8 h de sommeil chaque nuit.");
  if(!sick)add(5,"Mobilité","Hanches et mollets gardent de l'amplitude même les jours faciles.","10 minutes de mobilité des hanches et des mollets.");
  L.sort(function(a,b){return a.p-b.p});
  function item(x,i){return '<div class="lev"><i>'+(i+1)+'</i><div><b>'+esc(x.t)+'</b><span class="lwhy">'+esc(x.why)+'</span><span class="lhow">'+esc(x.how)+'</span></div></div>'}
  var sum=L.slice(0,3).map(item).join("");
  var more=L.length>3?L.slice(3).map(function(x,i){return item(x,i+3)}).join(""):"";
  out.push(card({key:"leviers",title:"Tes leviers de récup aujourd'hui",icon:"bulb",sum:sum,more:more||null}));

function debtDetail(){
  if(debtSeen<4)return '';
  var rows=DEBT_NIGHTS.slice(-7).reverse().map(function(r){
    var d=new Date(r.k+"T12:00:00Z"),lab=d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",timeZone:"UTC"});
    var du=function(x){var m=Math.round(x/60);return m<60?m+" min":Math.floor(m/60)+" h "+String(m%60).padStart(2,"0")};
    var eff=r.slept==null?"pas de données":r.delta>60?"+ "+du(r.delta)+" de dette":r.delta<-60?"− "+du(-r.delta)+" rattrapées":"équilibre";
    if(r.nap>60)eff+=" · sieste − "+du(r.nap);
    return '<tr><td>'+esc(lab)+'</td><td>'+hmSec(r.slept)+'</td><td>'+hmSec(r.need)+'</td><td>'+esc(eff)+'</td></tr>'}).join("");
  return '<h3>Ta dette de sommeil nuit par nuit</h3><table class="dtab"><thead><tr><th>Nuit</th><th>Dormi</th><th>Besoin</th><th>Effet</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<p class="small muted" style="margin:6px 0 0">Besoin : 7 h 30, plus 10 min par 100 de charge la veille (30 min au maximum) et 30 min si tu es malade. '+
    'Une nuit plus longue que ton besoin rembourse le surplus, 1 h au maximum par nuit ; une sieste rembourse sa durée (journal : courte 20 min, longue 45 min). '+
    'La dette s\'efface de 20 % par jour : une nuit courte pèse encore à moitié 3 jours plus tard. Au-delà de '+DEBT_MID.toString().replace(".",",")+' h, la page avance ton coucher ; au-delà de '+DEBT_HI+' h, elle compte un signal de fatigue dans le verdict.</p>';
}
/* ----- ton sommeil ----- */
(function(){
  var sc=TODAY.sleepScore,word=nn(sc)?"":sc>=80?"excellente":sc>=70?"bonne":sc>=60?"moyenne":"mauvaise",wlv=nn(sc)?"":sc>=70?"green":sc>=60?"orange":"red";
  var top='<div class="slhead"><div><div class="slbig">'+hmSec(TODAY.sleepSec)+'</div><div class="small muted">'+(TODAY.bedtime||TODAY.wakeup?esc((TODAY.bedtime||"–")+" → "+(TODAY.wakeup||"–")):"cette nuit")+'</div></div>'+

    if(pm==null&&curAt(t)&&curAt(t)!==SS[SS.length-1])pm=remAt(t);   /* reconstitué quand l'instantané manque (sauf dernière séance, recalée sur le matin) */

  if(!cfg||!cfg.token||/COLLE_ICI/.test(cfg.token)){window.__JSTAT="local";return}
  clearTimeout(window.__jt);
  window.__jt=setTimeout(async function(){
    window.__JSTAT="saving";window.__paintStat();
    var url="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/journal.json";
    var hd={Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json"};
    try{
      for(var tries=0;tries<3;tries++){
        var r=await fetch(url,{headers:hd,cache:"no-store"}),sha=null,days={};
        if(r.status===200){var j=await r.json();sha=j.sha;try{days=(JSON.parse(decodeURIComponent(escape(atob(String(j.content).replace(/\n/g,"")))))||{}).days||{}}catch(x){days={}}}
